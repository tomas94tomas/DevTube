{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Latest videos</h3>
<div class="row g-3">
  {% for v in videos %}
  <div class="col-md-4">
    <div class="card h-100">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ v.title }}</h5>
        <p class="card-text small text-muted">
          Source: {{ v.source.upper() }} · ❤ {{ v.likes }} · 👁 {{ v.views }}
        </p>
        <div class="mt-auto d-flex gap-2">
          <a class="btn btn-primary" href="/watch/{{ v.id }}">Watch</a>
          <form method="post" action="/delete/{{ v.id }}" onsubmit="return confirm('Delete this video?');">
            <button class="btn btn-outline-danger" type="submit">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
