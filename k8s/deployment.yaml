apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devtube
  template:
    metadata:
      labels:
        app: devtube
    spec:
      # 1) Make sure the mount dir exists and is writable before the app starts
      initContainers:
        - name: init-db-dir
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data && chmod 777 /data"]
          volumeMounts:
            - name: db
              mountPath: /data

      containers:
        - name: web
          image: ghcr.io/tomas94tomas/devtube:latest
          ports:
            - containerPort: 5000
          env:
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: devtube-secrets
                  key: AWS_REGION
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: devtube-secrets
                  key: AWS_S3_BUCKET
            - name: DB_PATH
              value: /data/videos.db     # the SQLite file lives on the PVC
          volumeMounts:
            - name: db
              mountPath: /data            # mount the PVC as a directory

      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: devtube-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devtube-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
