name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/tomas94tomas/devtube

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        # Run from repository root so the 'app/' directory is included in the build context
        run: |
          docker build -f docker/Dockerfile -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  # Optional: remote deploy via SSH to EC2 and kubectl apply
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/tomas94tomas/devtube:latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy manifests
        run: |
          scp -o StrictHostKeyChecking=no -r k8s ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/

      - name: Apply manifests on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} <<'EOF'
          set -e
          sudo kubectl create ns devtube || true
          # pin the image tag in the manifest (in case it was cached)
          sudo sed -i "s|ghcr.io/tomas94tomas/devtube:latest|$IMAGE|g" k8s/deployment.yaml
          sudo kubectl apply -n devtube -f k8s/deployment.yaml
          sudo kubectl apply -n devtube -f k8s/service.yaml
          EOF
