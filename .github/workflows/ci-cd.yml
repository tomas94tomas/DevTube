name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/tomas94tomas/devtube

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps for lint + tests
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run flake8 (code quality)
        run: flake8 app

      - name: Run pytest (sanity tests only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q app/tests/test_sanity.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -f docker/Dockerfile \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_BASE: ghcr.io/tomas94tomas/devtube

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy manifests
        run: scp -o StrictHostKeyChecking=no -r k8s ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/

      - name: Apply manifests on EC2 (immutable SHA with retries)
        env:
          IMG_SHA: ${{ env.IMAGE_BASE }}:${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} "IMG_SHA=${IMG_SHA}" <<'EOF'
          set -euo pipefail
          NS=devtube
          echo "Deploy image: ${IMG_SHA}"

          # retry wrapper for kubectl (handles transient API hiccups)
          k() {
            local try
            for try in 1 2 3 4 5; do
              if sudo kubectl --request-timeout=30s "$@"; then return 0; fi
              echo "kubectl retry $try failed; sleeping 5s..."
              sleep 5
            done
            # one last attempt with full output
            sudo kubectl "$@"
          }

          # Warm up the API once (reduces first-call timeouts)
          k version --short || true

          # Ensure namespace exists
          if ! k get namespace "${NS}" >/dev/null 2>&1; then
            k create namespace "${NS}"
          fi

          # Apply manifests
          k apply -n "${NS}" -f ~/k8s/deployment.yaml
          k apply -n "${NS}" -f ~/k8s/service.yaml

          # Set immutable image (SHA tag)
          k -n "${NS}" set image deploy/devtube web="${IMG_SHA}" --record=true

          # Wait for rollout (give it ample time to pull)
          k -n "${NS}" rollout status deploy/devtube --timeout=5m

          # Quick smoke-check (NodePort on the same node)
          curl -fsS --max-time 5 http://127.0.0.1:30080/ >/dev/null || true
          EOF



