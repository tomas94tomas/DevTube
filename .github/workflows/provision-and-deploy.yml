name: Provision and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: terraform

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - runner and repo info
        run: |
          echo "=== RUNNER INFO ==="
          uname -a || true
          echo "=== WORKDIR ==="
          pwd
          echo "=== TOP-LEVEL FILES ==="
          ls -la || true
          echo "=== TERRAFORM DIRECTORY (listing only) ==="
          ls -la terraform || true
          echo "=== K8S DIRECTORY (listing only) ==="
          ls -la k8s || true
          echo "=== GIT BRANCH ==="
          git rev-parse --abbrev-ref HEAD || true
          echo "=== ENV KEYS (filter) ==="
          env | grep -E 'GITHUB|RUNNER|HOME' || true
