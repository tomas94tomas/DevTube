name: Provision and Deploy (plan-only)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: terraform

jobs:
  plan:
    name: Terraform plan (safe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.6'

      - name: Terraform init/validate/plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform validate || true
          terraform plan -input=false -out=plan.tfplan
          terraform show -no-color plan.tfplan | sed -n '1,200p'

      - name: Export plan JSON and outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          terraform show -json plan.tfplan > plan.json || true
          terraform output -json > outputs.json || true

      - name: Upload terraform plan and outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-artifacts
          path: |
            ${{ env.TF_WORKING_DIR }}/plan.tfplan
            ${{ env.TF_WORKING_DIR }}/plan.json
            ${{ env.TF_WORKING_DIR }}/outputs.json
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate

      - name: Summary
        run: |
          echo "Terraform plan completed. Artifacts uploaded as 'terraform-plan-artifacts'."
          echo "If the plan looks good, we can add an explicit 'apply' step or run apply locally."
