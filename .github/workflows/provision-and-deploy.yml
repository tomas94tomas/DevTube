name: Provision and Deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: terraform

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: v1.6.6

      - name: Install AWS CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
[default]
aws_access_key_id = $AWS_ACCESS_KEY_ID
aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
EOF
          cat > ~/.aws/config <<EOF
[default]
region = $AWS_REGION
EOF

      - name: Generate temporary SSH keypair
        run: |
          ssh-keygen -t ed25519 -f ./deployer_key -N "" -q
          chmod 600 ./deployer_key

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_project: devtube
          TF_VAR_instance_type: t3.micro
        run: |
          # pass public key content and path to Terraform; main.tf should accept one of these
          PUBKEY=$(cat ../../deployer_key.pub)
          terraform apply -auto-approve -var "public_key=$PUBKEY" -var "public_key_path=$(pwd)/../../deployer_key.pub" -var "key_name=devtube" -var "aws_region=${{ secrets.AWS_REGION }}"

      - name: Capture instance IP
        working-directory: ${{ env.TF_WORKING_DIR }}
        id: tfoutputs
        run: |
          terraform output -raw instance_public_ip > instance_ip.txt || terraform output instance_public_ip | tr -d '"' > instance_ip.txt
          echo "instance_ip=$(cat instance_ip.txt)" >> $GITHUB_OUTPUT

      - name: Wait for SSH
        run: |
          IP=${{ steps.tfoutputs.outputs.instance_ip }}
          for i in {1..30}; do
            if nc -z -w 1 $IP 22; then echo SSH reachable; exit 0; fi
            echo waiting for ssh...; sleep 5
          done
          echo "SSH port not reachable on $IP"; exit 1

      - name: Copy manifests to EC2
        run: |
          IP=${{ steps.tfoutputs.outputs.instance_ip }}
          scp -o StrictHostKeyChecking=no -i ./deployer_key -r k8s ubuntu@$IP:/home/ubuntu/

      - name: Apply manifests on EC2
        run: |
          IP=${{ steps.tfoutputs.outputs.instance_ip }}
          ssh -o StrictHostKeyChecking=no -i ./deployer_key ubuntu@$IP <<'EOF'
          set -e
          kubectl create ns devtube || true
          sed -i "s|ghcr.io/tomas94tomas/devtube:latest|ghcr.io/tomas94tomas/devtube:latest|g" k8s/deployment.yaml
          kubectl apply -n devtube -f k8s/deployment.yaml
          kubectl apply -n devtube -f k8s/service.yaml
          EOF

      - name: Done
        run: echo "Provision and deploy finished"
